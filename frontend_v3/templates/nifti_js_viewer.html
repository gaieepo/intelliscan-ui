<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIfTI 3D Viewer - 3D-IntelliScan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --dark: #0f172a;
    --dark-light: #1e293b;
    --white: #ffffff;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--dark);
    color: var(--white);
    overflow: hidden;
    height: 100vh;
  }

  /* Modern Header */
  .viewer-header {
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow);
  }

  .brand {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.5px;
  }

  .brand span {
    background: linear-gradient(135deg, #6366f1 0%, #0ea5e9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .viewer-controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .viewer-controls .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }

  .viewer-controls .btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
  }

  .viewer-controls .btn.active {
    background: var(--primary);
    border-color: var(--primary);
  }

  /* Status Overlay */
  #statusOverlay {
    position: fixed;
    top: 80px;
    left: 20px;
    color: var(--white);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    padding: 12px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    z-index: 1000;
    max-width: 320px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow-lg);
  }

  /* Progress Bar */
  #progressBar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    z-index: 1000;
    overflow: hidden;
  }

  #progressFill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, #0ea5e9 100%);
    border-radius: 10px;
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Viewer Container */
  #viewer {
    width: 100%;
    height: calc(100vh - 65px);
    position: relative;
  }

  /* Loading Animation */
  .loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
</style>
</head>
<body>
  <div class="viewer-header">
    <div class="brand">
      <span>✨ 3D-IntelliScan</span> / NIfTI Viewer
    </div>
    <div class="viewer-controls">
      <button class="btn" id="btnWireframe">◻ Wireframe</button>
      <button class="btn" id="btnOpacity">◉ Opacity: High</button>
      <button class="btn" id="btnResolution">▦ 64</button>
      <button class="btn" id="btnThresholdDown">− Threshold</button>
      <button class="btn" id="btnThresholdUp">+ Threshold</button>
      <button class="btn" id="btnReset">↺ Reset</button>
    </div>
  </div>

  <div id="statusOverlay">
    <span class="spinner"></span> <span class="loading-dots">Initializing</span>
  </div>
  
  <div id="progressBar">
    <div id="progressFill"></div>
  </div>
  
  <div id="viewer"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

  const urlParams = new URLSearchParams(window.location.search);
  let niftiPath = urlParams.get('p');
  const templateNiftiPath = "{{ nifti_path }}";
  if (!niftiPath && templateNiftiPath && templateNiftiPath !== 'nifti_path') {
      niftiPath = templateNiftiPath;
  }

  if (!niftiPath) {
      document.getElementById('statusOverlay').innerHTML = '⚠️ No NIfTI path provided!';
      throw new Error('No NIfTI path provided');
  }

  let niftiBuffer = null;
  let niftiHeader = null;
  let niftiImage = null;
  let currentMesh = null;
  let settings = {
      resolution: 64,
      threshold: 0.5,
      opacity: 0.9,
      wireframe: false
  };

  document.getElementById('statusOverlay').innerHTML = '<span class="spinner"></span> Fetching NIfTI file...';

  async function fetchNiftiFile() {
      const response = await fetch(`/get_model_file/${niftiPath}`);
      if (!response.ok) {
          throw new Error(`Failed to fetch NIfTI file: ${response.status}`);
      }
      return await response.arrayBuffer();
  }

  function parseNifti(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const dataView = new DataView(arrayBuffer);
      
      const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2]);
      const isGzipped = magic === '\x1f\x8b';
      
      const header = {
          sizeof_hdr: dataView.getInt32(0, true),
          dim: [],
          datatype: dataView.getInt16(70, true),
          bitpix: dataView.getInt16(72, true),
          pixdim: [],
          magic: ''
      };
      
      for (let i = 4; i < 10; i++) {
          header.magic += String.fromCharCode(bytes[i]);
      }
      
      for (let i = 0; i < 8; i++) {
          header.dim[i] = dataView.getInt16(40 + i * 2, true);
      }
      
      for (let i = 0; i < 8; i++) {
          header.pixdim[i] = dataView.getFloat32(76 + i * 4, true);
      }
      
      return { header, isGzipped };
  }

  function getImageData(header, arrayBuffer) {
      const dim = header.dim;
      const nx = dim[1];
      const ny = dim[2];
      const nz = dim[3];
      const nt = dim[4];
      
      const numPixels = nx * ny * nz * nt;
      let data;
      const datatype = header.datatype;
      const bytesPerVoxel = Math.abs(header.bitpix / 8);
      
      let offset = 352;
      const dataView2 = new DataView(arrayBuffer, offset);
      
      switch (datatype) {
          case 2: data = new Uint8Array(arrayBuffer, offset, numPixels); break;
          case 4: data = new Int16Array(arrayBuffer, offset, numPixels); break;
          case 8: data = new Int32Array(arrayBuffer, offset, numPixels); break;
          case 16: data = new Float32Array(arrayBuffer, offset, numPixels); break;
          case 64: data = new Float64Array(arrayBuffer, offset, numPixels); break;
          case 512: data = new Uint16Array(arrayBuffer, offset, numPixels); break;
          case 768: data = new Uint32Array(arrayBuffer, offset, numPixels); break;
          default: throw new Error(`Unsupported data type: ${datatype}`);
      }
      
      return { data, nx, ny, nz, numPixels };
  }

  function createIsoSurface(data, nx, ny, nz, threshold, resolution) {
      const sx = Math.max(1, Math.floor(nx / resolution));
      const sy = Math.max(1, Math.floor(ny / resolution));
      const sz = Math.max(1, Math.floor(nz / resolution));
      
      const volumeData = new Float32Array(resolution * resolution * resolution);
      
      for (let z = 0; z < resolution; z++) {
          for (let y = 0; y < resolution; y++) {
              for (let x = 0; x < resolution; x++) {
                  let sum = 0;
                  let count = 0;
                  for (let dz = 0; dz < sz && z * sz + dz < nz; dz++) {
                      for (let dy = 0; dy < sy && y * sy + dy < ny; dy++) {
                          for (let dx = 0; dx < sx && x * sx + dx < nx; dx++) {
                              const srcIdx = ((z * sz + dz) * ny + (y * sy + dy)) * nx + (x * sx + dx);
                              if (srcIdx < data.length) {
                                  const val = data[srcIdx];
                                  if (!isNaN(val) && isFinite(val)) {
                                      sum += val;
                                      count++;
                                  }
                              }
                          }
                      }
                  }
                  volumeData[z * resolution * resolution + y * resolution + x] = count > 0 ? sum / count : 0;
              }
          }
      }
      
      return volumeData;
  }

  async function loadAndVisualize() {
      try {
          niftiBuffer = await fetchNiftiFile();
          document.getElementById('statusOverlay').innerHTML = '<span class="spinner"></span> Parsing NIfTI header...';
          document.getElementById('progressFill').style.width = '20%';
          
          const parserResult = parseNifti(niftiBuffer);
          niftiHeader = parserResult.header;
          
          document.getElementById('progressFill').style.width = '40%';
          
          const imageResult = getImageData(niftiHeader, niftiBuffer);
          niftiImage = imageResult;
          
          document.getElementById('progressFill').style.width = '60%';
          
          console.log(`NIfTI dimensions: ${imageResult.nx}x${imageResult.ny}x${imageResult.nz}`);
          
          let minVal = Infinity, maxVal = -Infinity;
          const sampleSize = Math.min(imageResult.data.length, 100000);
          for (let i = 0; i < sampleSize; i++) {
              const val = imageResult.data[i];
              if (val < minVal && !isNaN(val)) minVal = val;
              if (val > maxVal && !isNaN(val)) maxVal = val;
          }
          
          settings.threshold = (minVal + maxVal) * 0.3;
          document.getElementById('statusOverlay').innerHTML = '<span class="spinner"></span> Generating mesh...';
          
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x0f172a);
          
          const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          camera.position.set(2, 2, 2);
          
          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          document.getElementById('viewer').appendChild(renderer.domElement);
          
          const controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          
          const ambient = new THREE.AmbientLight(0xffffff, 0.4);
          scene.add(ambient);
          
          const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
          dirLight1.position.set(5, 5, 5);
          scene.add(dirLight1);
          
          const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
          dirLight2.position.set(-5, -3, -5);
          scene.add(dirLight2);
          
          const pointLight = new THREE.PointLight(0x6366f1, 0.5);
          pointLight.position.set(0, 0, 3);
          scene.add(pointLight);
          
          createMarchingCubesMesh(scene, imageResult.data, imageResult.nx, imageResult.ny, imageResult.nz);
          
          document.getElementById('progressFill').style.width = '90%';
          
          document.getElementById('btnWireframe').onclick = () => {
              settings.wireframe = !settings.wireframe;
              document.getElementById('btnWireframe').classList.toggle('active', settings.wireframe);
              updateMeshMaterial();
          };
          
          document.getElementById('btnOpacity').onclick = () => {
              settings.opacity = settings.opacity > 0.6 ? 0.6 : 0.95;
              document.getElementById('btnOpacity').innerText = `◉ Opacity: ${settings.opacity > 0.8 ? 'High' : 'Low'}`;
              updateMeshMaterial();
          };
          
          document.getElementById('btnResolution').onclick = () => {
              const resolutions = [32, 48, 64, 96, 128];
              const currentIdx = resolutions.indexOf(settings.resolution);
              settings.resolution = resolutions[(currentIdx + 1) % resolutions.length];
              document.getElementById('btnResolution').innerText = `▦ ${settings.resolution}`;
              if (currentMesh) {
                  scene.remove(currentMesh);
                  currentMesh.geometry.dispose();
              }
              createMarchingCubesMesh(scene, niftiImage.data, niftiImage.nx, niftiImage.ny, niftiImage.nz);
          };
          
          document.getElementById('btnThresholdDown').onclick = () => {
              settings.threshold = Math.max(0.1, settings.threshold - 0.05);
              updateMarchingCubes();
          };
          
          document.getElementById('btnThresholdUp').onclick = () => {
              settings.threshold = Math.min(0.9, settings.threshold + 0.05);
              updateMarchingCubes();
          };
          
          document.getElementById('btnReset').onclick = () => {
              camera.position.set(2, 2, 2);
              controls.target.set(0, 0, 0);
              controls.update();
              settings.threshold = 0.5;
              settings.resolution = 64;
              document.getElementById('btnResolution').innerText = `▦ ${settings.resolution}`;
          };
          
          window.addEventListener('resize', () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
          });
          
          function animate() {
              requestAnimationFrame(animate);
              controls.update();
              renderer.render(scene, camera);
          }
          
          document.getElementById('statusOverlay').innerHTML = '✅ Model Loaded<br><small class="text-muted">Scroll to zoom, drag to rotate</small>';
          document.getElementById('progressFill').style.width = '100%';
          setTimeout(() => {
              document.getElementById('progressBar').style.display = 'none';
          }, 500);
          
          animate();
          
      } catch (err) {
          document.getElementById('statusOverlay').innerHTML = '❌ Error: ' + err.message;
          console.error(err);
      }
  }

  function createMarchingCubesMesh(scene, data, nx, ny, nz) {
      const resolution = settings.resolution;
      const material = new THREE.MeshPhongMaterial({
          color: 0x6366f1,
          transparent: true,
          opacity: settings.opacity,
          side: THREE.DoubleSide,
          shininess: 50,
          wireframe: settings.wireframe
      });
      
      currentMesh = new MarchingCubes(resolution, material, true, true, 100000);
      currentMesh.position.set(0, 0, 0);
      currentMesh.scale.set(1, 1, 1);
      
      fillMarchingCubes(data, nx, ny, nz, resolution);
      
      scene.add(currentMesh);
  }

  function fillMarchingCubes(data, nx, ny, nz, resolution) {
      const volumeData = createIsoSurface(data, nx, ny, nz, settings.threshold, resolution);
      
      currentMesh.reset();
      
      const scalar = 1.0 - settings.threshold;
      for (let z = 0; z < resolution; z++) {
          for (let y = 0; y < resolution; y++) {
              for (let x = 0; x < resolution; x++) {
                  const idx = z * resolution * resolution + y * resolution + x;
                  const value = volumeData[idx];
                  currentMesh.setCell(x, y, z, value);
              }
          }
      }
      
      currentMesh.update();
  }

  function updateMarchingCubes() {
      if (currentMesh && niftiImage) {
          fillMarchingCubes(niftiImage.data, niftiImage.nx, niftiImage.ny, niftiImage.nz, settings.resolution);
      }
  }

  function updateMeshMaterial() {
      if (currentMesh) {
          currentMesh.material.wireframe = settings.wireframe;
          currentMesh.material.opacity = settings.opacity;
      }
  }

  loadAndVisualize();
  </script>
</body>
</html>
