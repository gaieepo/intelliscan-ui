<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer - 3D-IntelliScan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --dark: #0f172a;
    --dark-light: #1e293b;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --white: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--dark);
    color: var(--white);
    overflow: hidden;
    height: 100vh;
  }

  /* Modern Header */
  .viewer-header {
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow);
  }

  .brand {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.5px;
  }

  .brand span {
    background: linear-gradient(135deg, #6366f1 0%, #0ea5e9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .viewer-controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .viewer-controls .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }

  .viewer-controls .btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
  }

  .viewer-controls .btn.active {
    background: var(--primary);
    border-color: var(--primary);
  }

  /* Status Overlay */
  #statusOverlay {
    position: fixed;
    top: 80px;
    left: 20px;
    color: var(--white);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    padding: 12px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    z-index: 1000;
    max-width: 320px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow-lg);
  }

  /* Layers Panel */
  #layersPanel {
    position: absolute;
    top: 60px;
    right: 20px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1rem;
    min-width: 200px;
    display: none;
    z-index: 1000;
    box-shadow: var(--shadow-lg);
  }
  
  #layersPanel.visible { display: block; }

  /* Viewer Container */
  #viewer {
    width: 100%;
    height: calc(100vh - 65px);
    position: relative;
  }

  /* Loading Animation */
  .loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .viewer-header {
      flex-direction: column;
      gap: 1rem;
      padding: 0.75rem 1rem;
    }
    
    #statusOverlay {
      top: 120px;
      left: 10px;
      right: 10px;
      max-width: none;
    }
    
    .viewer-controls {
      flex-wrap: wrap;
      justify-content: center;
    }
  }

  /* Embedded Mode Styles */
  body.embedded .viewer-header { display: none !important; }
  body.embedded #viewer { height: 100vh !important; }
  body.embedded #statusOverlay { top: 20px !important; }
  body.embedded { background: transparent; }
  body.embedded #btnFloatingLayers { display: block !important; }
</style>
</head>
<body>
  <div class="viewer-header">
    <div class="brand">
      <span>✨ 3D-IntelliScan</span> / 3D Model Viewer
    </div>
    <div class="viewer-controls">
      <button class="btn" id="btnLayers">☰ Layers</button>
      <button class="btn" id="btnWireframe">◻ Wireframe</button>
      <button class="btn" id="btnOpacity">◉ Opacity: High</button>
      <button class="btn" id="btnReset">↺ Reset View</button>
    </div>
  </div>

  <button id="btnFloatingLayers" class="btn btn-sm btn-outline-light" style="position: absolute; top: 15px; right: 15px; z-index: 1001; display: none; backdrop-filter: blur(5px); background: rgba(0,0,0,0.5);">
    ☰ Layers
  </button>

  <div id="statusOverlay">
    <span class="loading-dots">Initializing</span><br>
    <small class="text-muted">Scroll to zoom, drag to rotate</small>
  </div>
  
  <div id="layersPanel">
    <h6 class="mb-3 text-white border-bottom pb-2 border-secondary">Visible Classes</h6>
    <div id="layersList"></div>
  </div>
  <div id="viewer"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  let scene, camera, renderer, controls;
  let loadedModel = null;
  let settings = {
      wireframe: false,
      opacity: 1.0
  };

  (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      let sampleParam = urlParams.get('p');
      
      // Check for embedded mode
      if (urlParams.get('embedded') === 'true') {
          document.body.classList.add('embedded');
      }
      
      const templateSampleName = "{{ sample_name }}";
      if (!sampleParam && templateSampleName && templateSampleName !== 'sample_name') {
          sampleParam = templateSampleName;
      }
      
      if (!sampleParam) {
          document.getElementById('statusOverlay').innerHTML = '⚠️ No sample parameter provided';
          return;
      }

      document.getElementById('statusOverlay').innerHTML = '🔄 Loading 3D model<span class="loading-dots"></span>';

      init();
      
      try {
          const isEmbedded = urlParams.get('embedded') === 'true';
          const typeParam = urlParams.get('type') || 'full';
          const response = await fetch(`/generate_model?p=${sampleParam}&inline=${isEmbedded}&type=${typeParam}`);
          
          if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
          }
          
          const data = await response.json();
          
          if (data.error) throw new Error(data.error);
          const modelUrl = data.gltf_url;
          
          console.log('Loading model from:', modelUrl);

          const loader = new GLTFLoader();
          loader.load(modelUrl, (gltf) => {
              loadedModel = gltf.scene;
              
              const box = new THREE.Box3().setFromObject(loadedModel);
              const center = box.getCenter(new THREE.Vector3());
              const size = box.getSize(new THREE.Vector3());
              
              loadedModel.position.x -= center.x;
              loadedModel.position.y -= center.y;
              loadedModel.position.z -= center.z;
              
              scene.add(loadedModel);
              
              fitCameraToObject(camera, loadedModel, controls);
              
              const layersList = document.getElementById('layersList');
              layersList.innerHTML = '';
              
              loadedModel.traverse((child) => {
                  if (child.isMesh && child.material) {
                      child.material.side = THREE.DoubleSide;
                      child.material.depthWrite = true;
                      child.material.depthTest = true;
                      
                      if (child.material.transparent) {
                          child.material.opacity = 1.0;
                          child.material.depthWrite = true;
                      }
                      
                      child.castShadow = true;
                      child.receiveShadow = true;
                      
                      // Add layer toggle
                      const div = document.createElement('div');
                      div.className = 'form-check mb-2';
                      const id = `layer-${child.uuid}`;
                      const name = child.name || `Object ${child.id}`;
                      
                      div.innerHTML = `
                        <input class="form-check-input" type="checkbox" id="${id}" checked>
                        <label class="form-check-label text-white small" for="${id}">${name}</label>
                      `;
                      layersList.appendChild(div);
                      
                      div.querySelector('input').addEventListener('change', (e) => {
                          child.visible = e.target.checked;
                      });
                  }
              });
              
              document.getElementById('statusOverlay').innerHTML = '✅ Model Loaded<br><small class="text-muted">Scroll to zoom, drag to rotate</small>';
              
          }, (progress) => {
              if (progress.total) {
                  const percent = Math.round(progress.loaded / progress.total * 100);
                  document.getElementById('statusOverlay').innerHTML = `📥 Loading... ${percent}%`;
              }
          }, (err) => {
              document.getElementById('statusOverlay').innerHTML = '❌ Error loading model: ' + err.message;
              console.error('GLTF Loader Error:', err);
          });

      } catch (err) {
          document.getElementById('statusOverlay').innerHTML = '❌ Error: ' + err.message;
          console.error(err);
      }
  })();

  function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.001, 1000);
      camera.position.set(3, 3, 3);

      renderer = new THREE.WebGLRenderer({ 
          antialias: true,
          alpha: true,
          powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.getElementById('viewer').appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 0.1;
      controls.maxDistance = 500;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      
      const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
      directionalLight1.position.set(5, 5, 5);
      scene.add(directionalLight1);
      
      const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight2.position.set(-5, -3, -5);
      scene.add(directionalLight2);
      
      const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight3.position.set(0, 5, -3);
      scene.add(directionalLight3);
      
      const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
      scene.add(hemisphereLight);

      document.getElementById('btnLayers').onclick = () => {
          const panel = document.getElementById('layersPanel');
          panel.classList.toggle('visible');
          document.getElementById('btnLayers').classList.toggle('active');
      };

      document.getElementById('btnFloatingLayers').onclick = () => {
          const panel = document.getElementById('layersPanel');
          panel.classList.toggle('visible');
          if (document.body.classList.contains('embedded')) {
             panel.style.top = '55px';
             panel.style.right = '15px';
          }
      };

      document.getElementById('btnWireframe').onclick = () => {
          settings.wireframe = !settings.wireframe;
          document.getElementById('btnWireframe').classList.toggle('active', settings.wireframe);
          if (loadedModel) {
              loadedModel.traverse((child) => {
                  if (child.isMesh && child.material) {
                      child.material.wireframe = settings.wireframe;
                  }
              });
          }
      };
      
      document.getElementById('btnOpacity').onclick = () => {
          settings.opacity = settings.opacity > 0.5 ? 0.5 : 1.0;
          document.getElementById('btnOpacity').innerText = `◉ Opacity: ${settings.opacity > 0.8 ? 'High' : 'Low'}`;
          if (loadedModel) {
              loadedModel.traverse((child) => {
                  if (child.isMesh && child.material) {
                      child.material.opacity = settings.opacity;
                      child.material.transparent = settings.opacity < 1.0;
                  }
              });
          }
      };
      
      document.getElementById('btnReset').onclick = () => {
          if (loadedModel) {
              fitCameraToObject(camera, loadedModel, controls);
          }
      };

      window.addEventListener('resize', onWindowResize);

      animate();
  }

  function fitCameraToObject(camera, object, controls) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim === 0) {
          camera.position.set(3, 3, 3);
          controls.target.set(0, 0, 0);
          return;
      }
      
      const fov = camera.fov * (Math.PI / 180);
      const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
      
      camera.position.set(cameraZ, cameraZ * 0.5, cameraZ);
      controls.target.copy(center);
      controls.update();
      
      const minZ = box.min.z;
      const maxZ = box.max.z;
      camera.near = Math.max(0.01, Math.abs(minZ) * 0.01);
      camera.far = Math.max(100, Math.abs(maxZ) * 100);
      camera.updateProjectionMatrix();
  }

  function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
  }
  </script>
</body>
</html>
